<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Code 128 scanner test</title>
<style>
body{margin:0;padding:14px;font:16px/1.4 system-ui,sans-serif;background:#111418;color:#eef1f5;max-width:560px;margin-inline:auto}
h1{font-size:1.2rem;margin:0 0 10px}
.row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
button{flex:1;min-width:30%;padding:12px 6px;border-radius:8px;border:1px solid #333a45;background:#1b2027;color:inherit;font:inherit;font-weight:600}
button.on{background:#2f7df6;border-color:#2f7df6}
#view{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:10px;overflow:hidden;margin-bottom:10px}
#view video,#view canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#view canvas.drawingBuffer{display:none}
.box{background:#1b2027;border:1px solid #333a45;border-radius:10px;padding:12px}
#res{font-size:1.4rem;font-weight:700;color:#4ade80;word-break:break-all;min-height:2rem}
#info{font-size:.85rem;color:#9aa3af}
#log{font-size:.8rem;color:#9aa3af;margin-top:8px;max-height:140px;overflow:auto}
</style>
</head>
<body>
<h1>Code 128 scanner test</h1>
<div class="row">
  <button id="bq">Quagga2</button>
  <button id="bz">ZBar</button>
  <button id="bn">Native</button>
  <button id="bs">Stop</button>
</div>
<div id="view"></div>
<div class="box">
  <div id="res">Waiting…</div>
  <div id="info">Pick a scanner and point at your barcode.</div>
  <div id="log"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@ericblade/quagga2@1.8.4/dist/quagga.min.js"></script>
<script type="module">
const $=id=>document.getElementById(id);
const view=$('view'),res=$('res'),info=$('info'),logEl=$('log');
const btns={q:$('bq'),z:$('bz'),n:$('bn')};
const NAMES={q:'Quagga2',z:'ZBar',n:'Native'};
let mode=null,t0=0,stream=null,running=false,handler=null,zbar=null;

function hit(code){
  const ms=Math.round(performance.now()-t0);
  res.textContent=code;
  info.textContent=NAMES[mode]+' read it in '+ms+' ms';
  logEl.insertAdjacentHTML('afterbegin','<div>'+NAMES[mode]+': '+code+' ('+ms+' ms)</div>');
  t0=performance.now();
}
async function stop(){
  running=false;
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  try{if(handler){Quagga.offDetected(handler);handler=null}Quagga.stop()}catch(e){}
  view.innerHTML='';mode=null;
  Object.values(btns).forEach(b=>b.classList.remove('on'));
}
function begin(m,msg){mode=m;btns[m].classList.add('on');res.textContent='Waiting…';info.textContent=msg}

async function openVideo(){
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1920},height:{ideal:1080}}});
  const v=document.createElement('video');
  v.setAttribute('playsinline','');v.muted=true;v.srcObject=stream;
  view.appendChild(v);await v.play();return v;
}

$('bq').onclick=async()=>{
  await stop();begin('q','Starting Quagga2…');
  Quagga.init({
    inputStream:{type:'LiveStream',target:view,constraints:{facingMode:'environment',width:{ideal:1280},height:{ideal:720}}},
    decoder:{readers:['code_128_reader']},
    locate:true,locator:{patchSize:'medium',halfSample:true},
    numOfWorkers:navigator.hardwareConcurrency||2,frequency:10
  },err=>{
    if(err){info.textContent='Error: '+(err.message||err);return}
    handler=r=>{if(r&&r.codeResult&&r.codeResult.code)hit(r.codeResult.code)};
    Quagga.onDetected(handler);Quagga.start();t0=performance.now();
    info.textContent='Scanning with Quagga2…';
  });
};

$('bn').onclick=async()=>{
  await stop();
  if(!('BarcodeDetector' in window)){info.textContent='Native BarcodeDetector not supported here (use Chrome on Android).';return}
  begin('n','Starting native detector…');
  try{
    const v=await openVideo();
    const det=new BarcodeDetector({formats:['code_128']});
    running=true;t0=performance.now();info.textContent='Scanning with native detector…';
    let last='';
    const tick=async()=>{
      if(!running)return;
      try{const r=await det.detect(v);if(r.length){if(r[0].rawValue!==last){last=r[0].rawValue;hit(last)}}else last=''}catch(e){}
      setTimeout(tick,60);
    };
    tick();
  }catch(e){info.textContent='Error: '+(e.message||e)}
};

$('bz').onclick=async()=>{
  await stop();begin('z','Loading ZBar…');
  try{
    if(!zbar)zbar=await import('https://cdn.jsdelivr.net/npm/@undecaf/zbar-wasm@0.11.0/dist/index.mjs');
  }catch(e){info.textContent='Could not load zbar-wasm: '+(e.message||e)+'. Check the version in the import URL.';return}
  try{
    const v=await openVideo();
    const cv=document.createElement('canvas'),ctx=cv.getContext('2d',{willReadFrequently:true});
    running=true;t0=performance.now();info.textContent='Scanning with ZBar…';
    let last='';
    const tick=async()=>{
      if(!running)return;
      try{
        const w=v.videoWidth,h=v.videoHeight;
        if(w){
          cv.width=w;cv.height=h;ctx.drawImage(v,0,0,w,h);
          const syms=await zbar.scanImageData(ctx.getImageData(0,0,w,h));
          const s=syms.find(x=>/128/.test(x.typeName||''));
          if(s){const t=s.decode();if(t!==last){last=t;hit(t)}}else last='';
        }
      }catch(e){info.textContent='ZBar error: '+(e.message||e)}
      setTimeout(tick,60);
    };
    tick();
  }catch(e){info.textContent='Error: '+(e.message||e)}
};

$('bs').onclick=()=>{stop();info.textContent='Stopped'};
</script>
</body>
</html>
